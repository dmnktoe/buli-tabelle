name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Bestehendes Tag, für das released werden soll (z. B. v1.1.0)'
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Entscheidet günstig (Linux), ob ein Release fällig ist:
  # - Tag-Push / manueller Dispatch  → immer.
  # - Push auf main                  → nur, wenn es für die Version in
  #                                     Version.swift noch kein Tag v<Version> gibt.
  decide:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.d.outputs.release }}
      tag: ${{ steps.d.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: d
        env:
          DISPATCH_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="$DISPATCH_TAG"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            VERSION=$(grep 'static let version' Sources/BuLiTabelle/Version.swift | sed -E 's/.*"([^"]+)".*/\1/')
            TAG="v$VERSION"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "push" ] && [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
              echo "▸ Tag $TAG existiert bereits — kein Release nötig."
              echo "release=false" >> "$GITHUB_OUTPUT"
            else
              echo "▸ Neue Version $TAG erkannt — Release wird ausgelöst."
              echo "release=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: decide
    if: needs.decide.outputs.release == 'true'
    runs-on: macos-15
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      FEED_URL: https://dmnktoe.github.io/buli-tabelle/appcast.xml
      TAG: ${{ needs.decide.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version mit Version.swift abgleichen
        run: |
          VERSION="${TAG#v}"
          SWIFT_VERSION=$(grep 'static let version' Sources/BuLiTabelle/Version.swift | sed -E 's/.*"([^"]+)".*/\1/')
          if [ "$VERSION" != "$SWIFT_VERSION" ]; then
            echo "::error::Tag $TAG (=$VERSION) passt nicht zu Version.swift ($SWIFT_VERSION). Version.swift bumpen und Tag entsprechend setzen."
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BULI_BUILD=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"
          echo "▸ Release BuLi Tabelle $VERSION (Tag $TAG, Build $(git rev-list --count HEAD))"

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Developer-ID-Zertifikat importieren (optional)
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}
        run: |
          if [ -z "$MACOS_CERT_P12" ]; then
            echo "▸ Kein Developer-ID-Zertifikat hinterlegt → ad-hoc-Build."
            echo "::warning::Ohne Developer-ID-Zertifikat ist der Release ad-hoc signiert und wird von Gatekeeper blockiert."
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed s/\"//g)
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          IDENTITY="$MACOS_SIGN_IDENTITY"
          if [ -z "$IDENTITY" ]; then
            IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | grep 'Developer ID Application' | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          fi
          [ -n "$IDENTITY" ] || { echo "::error::Keine 'Developer ID Application'-Identität in der Keychain gefunden."; exit 1; }
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "▸ Signiere mit: $IDENTITY"

      - name: Notarisierungs-Credentials einrichten (optional)
        env:
          MACOS_NOTARY_KEY_P8: ${{ secrets.MACOS_NOTARY_KEY_P8 }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          if [ -z "$MACOS_NOTARY_KEY_P8" ]; then
            echo "▸ Keine Notary-Credentials → Notarisierung wird übersprungen."
            exit 0
          fi
          echo "$MACOS_NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          echo "NOTARY_KEY_FILE=$RUNNER_TEMP/AuthKey.p8"      >> "$GITHUB_ENV"
          echo "NOTARY_KEY_ID=$MACOS_NOTARY_KEY_ID"           >> "$GITHUB_ENV"
          echo "NOTARY_ISSUER=$MACOS_NOTARY_ISSUER_ID"        >> "$GITHUB_ENV"

      - name: Sparkle-Signierschlüssel einrichten (erforderlich)
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          if [ -z "$SPARKLE_ED_PRIVATE_KEY" ]; then
            echo "::error::Secret SPARKLE_ED_PRIVATE_KEY fehlt. Ohne den privaten EdDSA-Key kann der Sparkle-Appcast nicht signiert werden — Auto-Updates würden abgelehnt. Export via 'generate_keys -x <datei>'."
            exit 1
          fi
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle_ed_key"
          echo "SPARKLE_ED_KEY_FILE=$RUNNER_TEMP/sparkle_ed_key" >> "$GITHUB_ENV"

      - name: Bauen (Universal, signiert falls Zertifikat vorhanden)
        run: ./build-app.sh

      - name: Notarisieren + tackern (falls Credentials vorhanden)
        run: ./scripts/notarize.sh build/BuLiTabelle.app

      - name: Sparkle-Release-Notes aus CHANGELOG erzeugen
        run: |
          NOTES_HTML="$RUNNER_TEMP/notes.html"
          python3 scripts/changelog-notes.py "$VERSION" CHANGELOG.md > "$NOTES_HTML" || true
          if [ -s "$NOTES_HTML" ]; then
            echo "APPCAST_NOTES_HTML=$NOTES_HTML" >> "$GITHUB_ENV"
            echo "▸ Sparkle-Release-Notes für $VERSION erzeugt ($(wc -c < "$NOTES_HTML") Bytes)."
          else
            echo "::warning::Kein CHANGELOG-Abschnitt für $VERSION — Sparkle-Update-Dialog zeigt keine Notes."
          fi

      - name: README-Screenshot rendern (16:9, XP-Backdrop, best effort)
        run: |
          BIN="build/BuLiTabelle.app/Contents/MacOS/BuLiTabelle"
          OUT="$RUNNER_TEMP/screenshot.png"
          BULI_SCREENSHOT="$OUT" BULI_SCREENSHOT_SCALE=2 BULI_SCREENSHOT_BG=xp "$BIN" \
            > "$RUNNER_TEMP/shot.log" 2>&1 &
          PID=$!
          for _ in $(seq 1 30); do
            [ -s "$OUT" ] && break
            sleep 1
          done
          kill "$PID" 2>/dev/null || true
          if [ -s "$OUT" ]; then
            echo "SCREENSHOT_FILE=$OUT" >> "$GITHUB_ENV"
            echo "✓ Screenshot gerendert ($(du -h "$OUT" | cut -f1))."
          else
            echo "::warning::Screenshot nicht gerendert (CI-Renderlimit?) — behalte vorhandenen."
            cat "$RUNNER_TEMP/shot.log" 2>/dev/null || true
          fi

      - name: Appcast-Historie mit veröffentlichtem Feed vereinen
        run: |
          if curl -fsSL "$FEED_URL" -o "$RUNNER_TEMP/live-appcast.xml"; then
            python3 scripts/merge-appcast.py \
              --current docs/appcast.xml --new "$RUNNER_TEMP/live-appcast.xml" \
              --out docs/appcast.xml --title "BuLi Tabelle" || true
          else
            echo "▸ Noch kein veröffentlichter Appcast (erstes Release?) — überspringe."
          fi

      - name: ZIP erzeugen + Appcast signieren
        run: ./scripts/make-appcast.sh

      - name: Downloadseite-Fallback aktualisieren
        run: |
          python3 - "$VERSION" "$TAG" <<'PY'
          import re, sys, os, datetime
          version, tag = sys.argv[1], sys.argv[2]
          path = "docs/index.html"
          html = open(path, encoding="utf-8").read()
          zip_url = f"https://github.com/{os.environ['GH_REPO']}/releases/download/{tag}/BuLiTabelle-{version}.zip"
          date = datetime.date.today().isoformat()
          obj = ('window.__BULI_FALLBACK__ = {"version":"%s","tag":"%s","zip":"%s","date":"%s"};'
                 % (version, tag, zip_url, date))
          html2, n = re.subn(r'window\.__BULI_FALLBACK__ = \{.*?\};', obj, html, count=1)
          if n == 0:
              print("::warning::Fallback-Marker nicht gefunden — Downloadseite unverändert.")
          else:
              open(path, "w", encoding="utf-8").write(html2)
              print("▸ Downloadseite-Fallback →", version, tag)
          PY

      - name: Release-Notes aus CHANGELOG.md holen
        run: |
          NOTES_FILE="$RUNNER_TEMP/relnotes.md"
          python3 - "$VERSION" "$NOTES_FILE" <<'PY'
          import re, sys
          version, out = sys.argv[1], sys.argv[2]
          try:
              text = open("CHANGELOG.md", encoding="utf-8").read()
          except FileNotFoundError:
              text = ""
          pattern = re.compile(
              r'^##\s*\[' + re.escape(version) + r'\][^\n]*\n(.*?)(?=^##\s|\Z)',
              re.MULTILINE | re.DOTALL)
          m = pattern.search(text)
          body = m.group(1).strip() if m else ""
          open(out, "w", encoding="utf-8").write(body)
          print("gefunden" if body else "fehlt")
          PY
          if [ -s "$NOTES_FILE" ]; then
            echo "NOTES_FILE=$NOTES_FILE" >> "$GITHUB_ENV"
            echo "▸ Release-Notes aus CHANGELOG.md-Abschnitt für $VERSION."
          else
            echo "::warning::Kein CHANGELOG.md-Abschnitt für $VERSION gefunden — GitHub generiert die Notes automatisch."
          fi

      - name: GitHub-Release anlegen / Asset hochladen
        run: |
          if gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "▸ Release $TAG existiert — lade Asset (clobber) hoch."
            gh release upload "$TAG" "dist/BuLiTabelle-$VERSION.zip" --clobber --repo "$GH_REPO"
            if [ -n "${NOTES_FILE:-}" ]; then
              gh release edit "$TAG" --repo "$GH_REPO" --notes-file "$NOTES_FILE"
            fi
          else
            echo "▸ Lege Release $TAG an."
            if [ -n "${NOTES_FILE:-}" ]; then
              gh release create "$TAG" "dist/BuLiTabelle-$VERSION.zip" \
                --repo "$GH_REPO" --target "$GITHUB_SHA" --title "BuLi Tabelle $TAG" --notes-file "$NOTES_FILE"
            else
              gh release create "$TAG" "dist/BuLiTabelle-$VERSION.zip" \
                --repo "$GH_REPO" --target "$GITHUB_SHA" --title "BuLi Tabelle $TAG" --generate-notes
            fi
          fi

      - name: Appcast + Downloadseite nach main sichern
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp docs/appcast.xml "$RUNNER_TEMP/appcast.xml"
          cp docs/index.html  "$RUNNER_TEMP/index.html"
          git fetch origin main
          git checkout -f -B main origin/main
          cp "$RUNNER_TEMP/appcast.xml" docs/appcast.xml
          cp "$RUNNER_TEMP/index.html"  docs/index.html
          if [ -n "${SCREENSHOT_FILE:-}" ] && [ -s "${SCREENSHOT_FILE:-/nonexistent}" ]; then
            cp "$SCREENSHOT_FILE" docs/screenshot.png
            git add docs/screenshot.png
          fi
          git add docs/appcast.xml docs/index.html
          if git diff --cached --quiet; then
            echo "▸ Keine docs-Änderungen zu committen."
          else
            git commit -m "chore(release): Appcast + Downloadseite für $TAG [skip ci]"
            git push origin HEAD:main \
              || echo "::warning::Push nach main fehlgeschlagen (evtl. Branch-Schutz)."
          fi
