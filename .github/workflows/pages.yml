name: Deploy download page

on:
  push:
    branches: [main]
    paths: ['docs/**']
  workflow_run:
    workflows: ['Release']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Pages-Inhalt zusammenstellen
        run: |
          rm -rf _site && mkdir _site
          cp docs/index.html docs/icon.png docs/appcast.xml _site/
          cp docs/favicon.ico docs/favicon-16x16.png docs/favicon-32x32.png docs/apple-touch-icon.png _site/

      - uses: actions/configure-pages@v5
        with:
          # Schaltet die Pages-Source selbst auf "GitHub Actions" um, falls das
          # Repo noch auf Branch-Deployment steht (sonst: "Get Pages site failed").
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Auf GitHub Pages deployen
        id: deploy
        uses: actions/deploy-pages@v4
